<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blink Blink Island — UI prototype</title><style> :root{font-family:system-ui,'Microsoft Yahei',sans-serif;color:#284e51;background:#d7ece5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#e9f2e8aa,#c5e8dbb3),url('../assets/scenes/island_morning.svg') center/cover fixed}header{padding:20px 4vw;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:14px;font-weight:750;font-size:22px}.brand img{width:52px}main{max-width:1100px;margin:24px auto 100px;padding:36px;border:1px solid #fff9;background:#ffffffe3;box-shadow:0 20px 70px #266c6744;border-radius:32px;min-height:550px}h1{font-size:clamp(28px,4vw,52px);margin:10px 0 22px}h2{font-size:24px;margin:16px 0}p{line-height:1.65}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin:22px 0}.card{border:1px solid #b6d9d2;background:#f3faf5;border-radius:24px;padding:24px;min-height:210px}.card img{height:100px;display:block;margin:auto}button,select,input{font:inherit}button{border:0;background:#398e86;color:white;padding:15px 22px;border-radius:18px;cursor:pointer;margin:5px;min-height:52px}button.secondary{background:#d2e9df;color:#275c5e}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e69c7e;outline-offset:3px}button:hover{filter:brightness(1.07)}.hero{display:flex;align-items:center;gap:20px}.hero img{width:min(230px,35%)}.visual{display:block;width:min(240px,65%);height:220px;object-fit:contain;margin:auto}.progress{height:15px;border-radius:10px;background:#e1ede6;overflow:hidden}.progress span{display:block;height:100%;background:#70bba6}.notice{background:#fff2db;border-radius:16px;padding:14px;margin:18px 0}.muted{color:#547477}.stat{font-size:36px;font-weight:700}input[type=range]{width:min(440px,90%)}@media(max-width:600px){main{margin:4px 12px;padding:24px}.hero{display:block}.hero img{width:100px}}</style></head><body><header><div class="brand"><img src="../assets/brand/app_icon.svg" alt=""><span id="brand"></span></div><button class="secondary" onclick="changeLang()">中文 / English</button></header><main id="screen"></main><script>const langData={"zh":{"brand":"眨眨岛","tagline":"让眼睛休息一下","full":"开始完整训练","single":"单项训练","blink":"闭眼休息","butterfly":"蝴蝶漫游","gaze":"眼球运动","history":"我的休息记录","settings":"设置","back":"返回","reminder":"提醒间隔","music":"背景音乐","sound":"音效","voice":"语音","pause":"暂停","resume":"继续","retry":"重试","skip":"跳过","done":"训练完成","closed":"完整闭眼，轻轻收紧眼睑，保持 3 秒；不要按压眼球。","follow":"保持头部自然稳定，跟随蝴蝶；可以自然眨眼。","move":"保持头部自然稳定，用眼睛跟随目标。","stats":"训练记录保存在本机","proto":"交互原型：按钮只展示页面和流程；没有接入眼动、通知或 PICO SDK。","next":"下一步","notice":"佩戴累计 60 分钟后提醒，支持 30～120 分钟设置。","complete":"已完成","incomplete":"未完成","language":"语言","stop":"如果感到疼痛或眩晕，请停止并摘下头显休息。"},"en":{"brand":"Blink Blink Island","tagline":"Give your eyes a little break","full":"Start full session","single":"Choose an activity","blink":"Close and rest","butterfly":"Butterfly glide","gaze":"Eye movements","history":"My activity history","settings":"Settings","back":"Back","reminder":"Reminder interval","music":"Music","sound":"Sounds","voice":"Voice","pause":"Pause","resume":"Resume","retry":"Retry","skip":"Skip","done":"Session complete","closed":"Close your eyes fully and gently squeeze your eyelids for 3 seconds. Do not press on your eyes.","follow":"Keep your head comfortably steady. Follow the butterfly and blink naturally.","move":"Keep your head comfortably steady. Follow the target with your eyes.","stats":"Activity history is stored locally","proto":"Interaction prototype only: no eye tracking, notification or PICO SDK integration.","next":"Next","notice":"Reminder after 60 minutes of headset wear. Adjustable from 30 to 120 minutes.","complete":"Completed","incomplete":"Not completed","language":"Language","stop":"If you feel pain or dizziness, stop and remove the headset to rest."}};let lang='zh',page='home',mode='full',activity='blink',step=0,interval=60,paused=false,completed=0;let order=['blink','butterfly','gaze'];const asset={blink:'../assets/targets/eye_closed.svg',butterfly:'../assets/characters/butterfly_front.svg',gaze:'../assets/targets/orbit_ring.svg'};function t(k){return langData[lang][k]}function go(p){page=p;render()}function changeLang(){lang=lang==='zh'?'en':'zh';document.documentElement.lang=lang;render()}function begin(a,full=false){mode=full?'full':'single';activity=a;step=0;paused=false;go('training')}function advance(){step++;if(mode==='full'&&order.indexOf(activity)<2){activity=order[order.indexOf(activity)+1];go('training')}else{completed++;go('done')}}function render(){document.querySelector('#brand').textContent=t('brand');let body='';const back='<button class="secondary" onclick="go(\'home\')">'+t('back')+'</button>';if(page==='home')body='<div class="hero"><img src="../assets/brand/logo_symbol.svg" alt=""><div><h1>'+t('tagline')+'</h1><p>'+t('notice')+'</p><button onclick="begin(\'blink\',true)">'+t('full')+'</button></div></div><h2>'+t('single')+'</h2><div class="cards">'+order.map(a=>'<div class="card"><img src="'+asset[a]+'" alt=""><h2>'+t(a)+'</h2><button onclick="begin(\''+a+'\')">'+t('next')+'</button></div>').join('')+'</div><button class="secondary" onclick="go(\'stats\')">'+t('history')+'</button><button class="secondary" onclick="go(\'settings\')">'+t('settings')+'</button>';if(page==='training'){let instruction={blink:'closed',butterfly:'follow',gaze:'move'}[activity];body=back+'<h1>'+t(activity)+'</h1><img class="visual" src="'+asset[activity]+'" alt=""><p>'+t(instruction)+'</p><div class="progress"><span style="width:'+((order.indexOf(activity)+1)*33.33)+'%"></span></div><p>'+t('proto')+'</p><button onclick="go(\'incomplete\')">'+t('incomplete')+'</button><button onclick="advance()">'+t('next')+'</button><button class="secondary" onclick="paused=!paused;this.textContent=paused?t(\'resume\'):t(\'pause\')">'+t('pause')+'</button><div class="notice">'+t('stop')+'</div>'}if(page==='incomplete')body='<h1>'+t('incomplete')+'</h1><img class="visual" src="'+asset[activity]+'" alt=""><button onclick="go(\'training\')">'+t('retry')+'</button><button class="secondary" onclick="advance()">'+t('skip')+'</button>'+back;if(page==='done')body='<img class="visual" src="../assets/brand/logo_symbol.svg" alt=""><h1>'+t('done')+'</h1><p>'+t('proto')+'</p>'+back+'<button onclick="go(\'stats\')">'+t('history')+'</button>';if(page==='stats')body=back+'<h1>'+t('history')+'</h1><div class="cards"><div class="card"><p>'+t('complete')+'</p><div class="stat">'+completed+'</div></div><div class="card"><p>'+t('incomplete')+'</p><div class="stat">—</div></div></div><p>'+t('stats')+'</p><p>'+t('proto')+'</p>';if(page==='settings')body=back+'<h1>'+t('settings')+'</h1><p>'+t('reminder')+': <output id="value">'+interval+'</output> min</p><input type="range" min="30" max="120" step="10" value="'+interval+'" oninput="interval=+this.value;document.querySelector(\'#value\').value=interval"><p>'+t('language')+': <button class="secondary" onclick="changeLang()">中文 / English</button></p>'+['music','sound','voice'].map(k=>'<p>'+t(k)+'</p><input type="range" aria-label="'+t(k)+'">').join('')+'<p>'+t('proto')+'</p>';document.querySelector('#screen').innerHTML=body}render()</script></body></html>
